name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          
      - name: Restore Dependencies
        run: dotnet restore IngestionEngine.sln
        
      - name: Build Solution
        run: dotnet build IngestionEngine.sln -c Release --no-restore
        
      - name: Execute Tests
        run: dotnet test IngestionEngine.sln -c Release --no-build --verbosity normal --logger "trx"